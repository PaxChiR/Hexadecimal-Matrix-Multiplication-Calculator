<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hex Matrix Multiplier</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto+Mono:wght@400;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="container">
        <header>
            <h1>HEX MATRIX MULTIPLIER</h1>
            <p>Enter 4x4 Hexadecimal Matrices (0-9, A-F)</p>
        </header>

        <main>
            <div class="matrix-container">
                <div class="matrix-box">
                    <h2>Matrix A</h2>
                    <div class="grid" id="matrixA">
                        <!-- Inputs will be generated by JS or hardcoded if simple -->
                        <!-- Row 0 -->
                        <input type="text" maxlength="4" placeholder="00" data-row="0" data-col="0">
                        <input type="text" maxlength="4" placeholder="00" data-row="0" data-col="1">
                        <input type="text" maxlength="4" placeholder="00" data-row="0" data-col="2">
                        <input type="text" maxlength="4" placeholder="00" data-row="0" data-col="3">
                        <!-- Row 1 -->
                        <input type="text" maxlength="4" placeholder="00" data-row="1" data-col="0">
                        <input type="text" maxlength="4" placeholder="00" data-row="1" data-col="1">
                        <input type="text" maxlength="4" placeholder="00" data-row="1" data-col="2">
                        <input type="text" maxlength="4" placeholder="00" data-row="1" data-col="3">
                        <!-- Row 2 -->
                        <input type="text" maxlength="4" placeholder="00" data-row="2" data-col="0">
                        <input type="text" maxlength="4" placeholder="00" data-row="2" data-col="1">
                        <input type="text" maxlength="4" placeholder="00" data-row="2" data-col="2">
                        <input type="text" maxlength="4" placeholder="00" data-row="2" data-col="3">
                        <!-- Row 3 -->
                        <input type="text" maxlength="4" placeholder="00" data-row="3" data-col="0">
                        <input type="text" maxlength="4" placeholder="00" data-row="3" data-col="1">
                        <input type="text" maxlength="4" placeholder="00" data-row="3" data-col="2">
                        <input type="text" maxlength="4" placeholder="00" data-row="3" data-col="3">
                    </div>
                </div>

                <div class="operation">
                    <span class="cross">×</span>
                </div>

                <div class="matrix-box">
                    <h2>Matrix B</h2>
                    <div class="grid" id="matrixB">
                        <!-- Row 0 -->
                        <input type="text" maxlength="4" placeholder="00" data-row="0" data-col="0">
                        <input type="text" maxlength="4" placeholder="00" data-row="0" data-col="1">
                        <input type="text" maxlength="4" placeholder="00" data-row="0" data-col="2">
                        <input type="text" maxlength="4" placeholder="00" data-row="0" data-col="3">
                        <!-- Row 1 -->
                        <input type="text" maxlength="4" placeholder="00" data-row="1" data-col="0">
                        <input type="text" maxlength="4" placeholder="00" data-row="1" data-col="1">
                        <input type="text" maxlength="4" placeholder="00" data-row="1" data-col="2">
                        <input type="text" maxlength="4" placeholder="00" data-row="1" data-col="3">
                        <!-- Row 2 -->
                        <input type="text" maxlength="4" placeholder="00" data-row="2" data-col="0">
                        <input type="text" maxlength="4" placeholder="00" data-row="2" data-col="1">
                        <input type="text" maxlength="4" placeholder="00" data-row="2" data-col="2">
                        <input type="text" maxlength="4" placeholder="00" data-row="2" data-col="3">
                        <!-- Row 3 -->
                        <input type="text" maxlength="4" placeholder="00" data-row="3" data-col="0">
                        <input type="text" maxlength="4" placeholder="00" data-row="3" data-col="1">
                        <input type="text" maxlength="4" placeholder="00" data-row="3" data-col="2">
                        <input type="text" maxlength="4" placeholder="00" data-row="3" data-col="3">
                    </div>
                </div>
            </div>

            <div class="settings">
                <label class="toggle-switch">
                    <input type="checkbox" id="gfMode" checked>
                    <span class="slider round"></span>
                </label>
                <span class="mode-label">Mode: Galois Field (AES)</span>
            </div>

            <div class="actions">
                <button id="multiplyBtn">CALCULATE RESULT</button>
                <button id="clearBtn" class="secondary">CLEAR</button>
            </div>

            <div class="result-container">
                <h2>Result Matrix</h2>
                <div class="grid result-grid" id="matrixC">
                    <!-- Output cells -->
                    <!-- Row 0 -->
                    <div class="cell" data-row="0" data-col="0">00</div>
                    <div class="cell" data-row="0" data-col="1">00</div>
                    <div class="cell" data-row="0" data-col="2">00</div>
                    <div class="cell" data-row="0" data-col="3">00</div>
                    <!-- Row 1 -->
                    <div class="cell" data-row="1" data-col="0">00</div>
                    <div class="cell" data-row="1" data-col="1">00</div>
                    <div class="cell" data-row="1" data-col="2">00</div>
                    <div class="cell" data-row="1" data-col="3">00</div>
                    <!-- Row 2 -->
                    <div class="cell" data-row="2" data-col="0">00</div>
                    <div class="cell" data-row="2" data-col="1">00</div>
                    <div class="cell" data-row="2" data-col="2">00</div>
                    <div class="cell" data-row="2" data-col="3">00</div>
                    <!-- Row 3 -->
                    <div class="cell" data-row="3" data-col="0">00</div>
                    <div class="cell" data-row="3" data-col="1">00</div>
                    <div class="cell" data-row="3" data-col="2">00</div>
                    <div class="cell" data-row="3" data-col="3">00</div>
                </div>
            </div>
        </main>
        <footer>
            <p>Made with Antigravity</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>

</html>
